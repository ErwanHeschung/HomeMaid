name: Release plugins

# Each official plugin (core/plugins/<dir>/registry.json) whose Cargo.toml version has no release
# yet is built, signed with the CI key (secret MINISIGN_KEY, its public key in
# core/plugins/minisign.pub) and released with its registry entry (entry.json). HomeMaid-plugins
# then proposes it to its index. Signing waits for an approval: the `release` environment.

on:
  push:
    branches: [main]
    paths: ["core/plugins/**", "core/plugin-api/**", "core/crates/caps/**", "core/tools/release_plugins.py"]
  workflow_dispatch:

concurrency:
  group: release-plugins

permissions:
  contents: write

jobs:
  pending:
    name: Versions to release
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.list.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        working-directory: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(python3 tools/release_plugins.py --pending | tr '\n' ' ')
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "To release: ${tags:-nothing}"

  release:
    name: Build, sign and release
    needs: pending
    if: needs.pending.outputs.tags != ''
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - name: Release ${{ needs.pending.outputs.tags }}
        env:
          GH_TOKEN: ${{ github.token }}
          SECRET_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          MINISIGN_KEY="$RUNNER_TEMP/minisign.key" python3 tools/release_plugins.py
