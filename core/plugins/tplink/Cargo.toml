[package]
name = "tplink-plugin"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# cdylib: the plugin; rlib: lets the core's tests reuse `klap` for a fake device.
crate-type = ["cdylib", "rlib"]

[dependencies]
aes = "0.9.3"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc"] }
getrandom = "0.4.3"
homemaid-plugin = { path = "../../plugin-api" }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
