# Copy to homemaid.toml and adjust. Relative paths are resolved against this file's directory.
[core]
bind = "0.0.0.0:8123"
data_dir = "data"
# Clients authenticate with `Authorization: Bearer <token>` or `/ws?token=<token>`.
# Replace both tokens with long random strings (16 characters at least): the placeholders are refused.
token = "change-me"
# Plugin secrets go in <data_dir>/secrets.toml, one table per plugin id, never in this file.
# Where the home is, only for sunrise and sunset in automations (your town is precise enough;
# nothing leaves this PC).
# latitude = 48.86
# longitude = 2.35
# Where the app finds plugins to install (an index.json); the official registry by default.
# Read only when you browse or install, never to run.
# registry = "https://raw.githubusercontent.com/ErwanHeschung/HomeMaid-plugins/main/index.json"

# PC agent (run with --agent, in the user's session): remote control of this PC.
# On the phone: http://<this PC's IP>:8124/remote#token=<agent.token>
[agent]
# enabled = true      # desktop mode only: the window's "PC control" switch writes it
# discover_apps = true   # the Start menu's apps can be launched and pinned from the phone (off by default)
bind = "0.0.0.0:8124"
token = "change-me-too"

[agent.apps]
# Only these can be launched from the remote. Bare names are looked up in PATH.
notepad = "notepad.exe"

# Services on the remote: a logo (app/assets/logos/<icon>.svg), what opens them (a URL goes to
# the default browser, or a program), and the keys their player answers to. Play/pause, back and
# forward default to Space and the arrows; the playback buttons send keys to the focused window.
[[agent.shortcut]]
name = "Netflix"
icon = "netflix"
open = "https://www.netflix.com"
keys = { skip_intro = "s" }

[[agent.shortcut]]
name = "YouTube"
icon = "youtube"
open = "https://www.youtube.com"
keys = { restart = "0", next_episode = "shift+n" }

[[agent.shortcut]]
name = "Spotify"
icon = "spotify"
open = "https://open.spotify.com"

[[agent.shortcut]]
name = "Twitch"
icon = "twitch"
open = "https://www.twitch.tv"

[[agent.shortcut]]
name = "Crunchyroll"
icon = "crunchyroll"
open = "https://www.crunchyroll.com"
keys = { restart = "0", next_episode = "shift+n", skip_intro = "s" }

# The PC as an entity of the core (volume, mute, sensors), through its agent:
#   cargo build -p pc-plugin --target wasm32-wasip2
# and in <data_dir>/secrets.toml:  [pc]  token = "<agent.token>"
# [[plugin]]
# id = "pc"
# path = "target/wasm32-wasip2/debug/pc_plugin.wasm"
# permissions = ["local-network", "loopback"]   # loopback: only when the agent runs on this PC
#
# [plugin.settings]
# agent = "127.0.0.1:8124"

# Plugins installed from the app (Settings > Plugins) are written here too, with their `.wasm` in
# <data_dir>/plugins, their `version`, and the author's `key` every update must be signed with.

# Mock plugin, build it first: cargo build -p mock-plugin --target wasm32-wasip2
[[plugin]]
id = "mock"
path = "target/wasm32-wasip2/debug/mock_plugin.wasm"
# Granted permissions; a plugin asking for more is refused. `local-network` excludes this PC
# (loopback), where the hub and the agent listen: grant `loopback` too only to a plugin whose
# device runs on this PC.
permissions = ["local-network"]

[plugin.settings]
# crash_once = "true"

# Brands (TP-Link Tapo...) are installed from the app: Settings > Plugins. They are written here
# as [[plugin]] tables like the ones above. Their code: github.com/ErwanHeschung/HomeMaid-plugins.

# Optional user metadata over discovered entities, by stable UUID (see entities.list).
[[entity]]
id = "b2ab420e-3e8d-569b-80ee-016956537f82"
name = "Lampe salon"
room = "salon"
tags = ["lumiere"]

# Automations: checked when the core starts (a mistake stops it, with the reason in the log).
# Devices are chosen by selectors: room:, tag:, cap:, plugin:, device:, model:, id:, name:"..."
# combined with & | ! and parentheses. Changing them takes a core restart.
#
# The app's Scénarios tab writes these sections too (one [[automation]] each), in force at once.
# [[automation]]
# id = "evening-lamp"
# name = "Lampe du soir"
# [[automation.trigger]]
# at = "19:30"                                   # local time
# days = ["mon", "tue", "wed", "thu", "fri"]     # default: every day
# [[automation.condition]]
# between = ["18:00", "01:00"]                   # across midnight when the end is earlier
# [[automation.action]]
# set = { select = "room:Salon & cap:brightness", cap = "brightness", value = 40 }
#
# [[automation]]
# id = "dusk"
# [[automation.trigger]]
# at = "sunset-15"                               # sunrise / sunset, shifted by ±minutes (360 at most)
# [[automation.condition]]
# between = ["sunset", "23:30"]                  # sunrise and sunset work here too
# [[automation.action]]
# set = { select = "room:Salon & cap:on_off", cap = "on_off", value = true }
#
# [[automation]]
# id = "pause-when-muted"
# [[automation.trigger]]
# when = { select = "plugin:pc", cap = "mute", becomes = true }   # or above = / below = / changes = true
# [[automation.action]]
# invoke = { select = "plugin:pc", action = "play_pause" }         # params = { ... } when the action takes some
#
# Steps can also be a workflow: nodes linked by their ports, as in n8n (the app draws them).
# A node does one thing: set, invoke, delay, wait, if, repeat, merge or stop. Its ports say what
# comes next: next (and error for set/invoke), then/else (if), next/timeout (wait), body/next
# (repeat). Several nodes on a port run side by side; a merge joins them back (mode all or any).
# A failed set/invoke without an error port goes on through next. No loop but `repeat`.
# [[automation]]
# id = "living-at-night"
# mode = "restart"                               # started again while running: single (skip, default), restart, queued, parallel
# start = ["on"]                                 # the first node(s)
# [[automation.trigger]]
# id = "dusk"                                    # named: a condition can say `trigger = "dusk"`
# at = "sunset"
# [[automation.node]]
# id = "on"
# set = { select = 'room:"Salon" & cap:on_off', cap = "on_off", value = true }
# next = ["still"]
# [[automation.node]]
# id = "still"
# wait = { until = [{ state = { select = "cap:custom:motion", cap = "custom:motion", is = false } }], timeout = "2h" }
# next = ["off"]                                 # passed
# timeout = ["dim"]                              # 2 h went by first (no timeout port: goes on through next)
# [[automation.node]]
# id = "off"
# set = { select = 'room:"Salon" & cap:on_off', cap = "on_off", value = false }
# [[automation.node]]
# id = "dim"
# if = [{ state = { select = 'room:"Salon" & cap:brightness', cap = "brightness", above = 20 } }]   # any = true: one is enough
# then = ["each"]
# [[automation.node]]
# id = "each"
# repeat = { for_each = 'room:"Salon" & cap:brightness' }   # or count = 3, while = [...], until = [...]
# body = ["dim-one"]
# [[automation.node]]
# id = "dim-one"
# set = { select = "item", cap = "brightness", value = 10 }   # item: the device of this turn; trigger: the one that started it
# next = ["pause"]
# [[automation.node]]
# id = "pause"
# delay = "2s"                                   # 45s, 10m, 1h30m
# Also: merge = "all" or "any", and stop = {} or stop = { error = "why" }.
# In a set, from = "trigger" replaces value: the value that started the run (a `when` trigger).
