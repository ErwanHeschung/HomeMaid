[package]
name = "homemaid"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
caps = { path = "../caps" }
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4", default-features = false }
jiff = "0.2.38"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sunrise = "3.0.0"
mdns-sd = "0.21.5"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
# Runs the branches of an automation side by side; axum already pulls it in.
futures-util = "0.3.34"
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.28.0", features = ["serde", "v4", "v5"] }
# Only what the host uses: no cache (zstd) or profiling (ittapi), which also pull in C code.
wasmtime = { version = "49.0.3", default-features = false, features = [
    "addr2line",
    "anyhow",
    "backtrace",
    "component-model",
    "cranelift",
    "demangle",
    "parallel-compilation",
    "runtime",
    "std",
] }
wasmtime-wasi = "49.0.3"
ureq = "3.4.2"
minisign-verify = "0.3.0"

[target.'cfg(windows)'.dependencies]
enigo = "0.6.1"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Media_Control",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Power",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Paused time, for the automations' delays and waits.
tokio = { version = "1.53.3", features = ["test-util"] }
# WebSocket client for tests/agent.rs; same versions axum already pulls in.
tokio-tungstenite = "0.29.0"
minisign = "0.10.0"
